name: ubermotor
description: "UberMotor: moto-ride con saldo de carreras prepagado"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  web_socket_channel: ^3.0.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  onesignal_flutter: 5.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "logo_icons/logo_app.png"
  android: true
  ios: true
  web:
    generate: true
    background_color: "#141414"
    theme_color: "#F5B800"
  windows:
    generate: true
  macos:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - logo_icons/logo.webp
